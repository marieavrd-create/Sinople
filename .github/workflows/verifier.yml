# Vérifie chaque PR : types, tests et construction du site.
name: Vérification

on:
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types (astro check)
        run: npm run check
      - name: Tests (Vitest)
        run: npm test
      - name: Construction du site
        run: npm run build
